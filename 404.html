<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Korvi</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <!-- Tokens, fonts and .btn come from the shared stylesheet. This page used
       to inline its own copy of the token block, which had already drifted
       (it was missing --lime); linking brand.css means it can't drift again. -->
  <link rel="stylesheet" href="/brand.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--wash);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      max-width: 420px;
      width: 100%;
      background: var(--white);
      border: 1px solid var(--hair);
      border-radius: 24px;
      padding: 40px 32px;
      text-align: center;
    }

    /* The wordmark half of the lockup is fill="currentColor", so it adapts
       to light/dark from this link's colour — which only works because the
       SVG is inlined below rather than loaded through an <img>. */
    .logo {
      display: inline-flex;
      color: var(--ink);
      text-decoration: none;
      margin-bottom: 24px;
    }
    .logo svg { display: block; height: 30px; width: auto; }

    h1 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    p {
      color: var(--ink-soft);
      font-size: 15px;
      margin-bottom: 24px;
    }

    /* .btn/.btn-primary/.btn-secondary come from brand.css — only the
       full-width stacked-card variation is page-specific. */
    .btn {
      justify-content: center;
      width: 100%;
      padding: 14px 24px;
      margin-bottom: 12px;
    }

    .hint {
      font-size: 13px;
      color: var(--ink-faint);
      margin-top: 16px;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid var(--green-hair);
      border-top-color: var(--green);
      border-radius: 50%;
      margin: 0 auto 20px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

      </svg>
    </a>
    <div id="card"><!-- Filled in by script below --></div>
  </div>

  <script>
    (function () {
      var card = document.getElementById('card');

      // #878 NOTE: the /share/:type/:code branch below is currently
      // unreachable. korvi-app's #766/#874 Cloudflare Worker
      // (korvi-app/docs/deploy/share-preview-worker.js) transparently
      // proxies every request to korvi.eu/share/* — crawler or human —
      // straight to a Supabase edge function, which now handles the full
      // human-facing experience this file was originally built for
      // (styled tease + korvi:// redirect attempt), plus content-aware
      // OG tags for link-preview crawlers. GitHub Pages (and this file)
      // never sees a /share/* request while that Worker route exists.
      // Left in place rather than deleted in case routing ever moves back
      // to this repo — see korvi-app#878 and the not-yet-filed korvi-web
      // revamp ticket for the current thinking on where this should live
      // long-term.

      // Match /share/:type/:code (type = household|recipe, code = 7-char alphanumeric)
      var match = window.location.pathname.match(/^\/share\/([a-zA-Z]+)\/([a-zA-Z0-9]{1,16})\/?$/);

      if (!match) {
        // Not a share link — plain 404
        card.innerHTML =
          '<h1>Page not found</h1>' +
          '<p>That page doesn\'t exist. Head back to the homepage.</p>' +
          '<a href="/" class="btn btn-primary">Go to korvi.eu</a>';
        return;
      }

      var type = match[1];
      var code = match[2];
      var appUrl = 'korvi://share/' + type + '/' + code;
      var label = type === 'household' ? 'household invite' : 'shared recipe';

      card.innerHTML =
        '<div class="spinner"></div>' +
        '<h1>Opening this ' + label + '&hellip;</h1>' +
        '<p>This link opens in the Korvi app. If nothing happens, you may not have it installed yet.</p>' +
        '<a id="open-app" href="' + appUrl + '" class="btn btn-primary">Open in Korvi</a>' +
        '<a href="mailto:earlyaccess@korvi.eu?subject=Korvi%3A%20Early%20Access%20Request" class="btn btn-secondary">Get early access</a>' +
        '<div class="hint">Korvi is currently in early access on iOS and Android.</div>';

      // Attempt an app-scheme redirect; if the app isn't installed the tab just
      // stays put and the visitor sees the fallback card above.
      var attempted = false;
      function tryOpenApp() {
        if (attempted) return;
        attempted = true;
        window.location.href = appUrl;
      }
      // Small delay so the fallback UI paints first (avoids a blank flash on iOS
      // when the OS is deciding whether to hand off to the app).
      setTimeout(tryOpenApp, 250);
    })();
  </script>
</body>
</html>
