<h1>Your email is confirmed</h1>
<p>Thanks. Your Korvi account is ready.</p>
<p><strong>Open Korvi on your phone and sign in</strong> with your email and password.</p>
<p id="open-wrap" hidden><a id="open-app" href="korvi://auth/callback">Open Korvi</a></p>
<p>Don't have the app yet? Get Korvi on <a href="https://play.google.com/store/apps/details?id=eu.korvi.app">Google Play</a> or the <a href="https://apps.apple.com/app/id6788116102">App Store</a>.</p>
<p>Questions? Email <a href="mailto:hello@korvi.eu">hello@korvi.eu</a>.</p>
<script>
(function () {
  var target = 'korvi://auth/callback' + window.location.search + window.location.hash;
  var link = document.getElementById('open-app');
  link.href = target;
  if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
    document.getElementById('open-wrap').hidden = false;
    window.location.replace(target);
  }
})();
</script>
