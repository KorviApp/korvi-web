<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Korvi</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/logo-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --green: #2D7A3A;
      --green-dark: #205A2C;
      --mint: #EAF4EC;
      --green-hair: #BCDCC1;
      --ink: #0F1413;
      --ink-soft: #6B7572;
      --ink-faint: #9AA19E;
      --hair: #ECECEA;
      --wash: #F6F6F3;
      --white: #FFFFFF;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink);
      background: var(--wash);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      max-width: 420px;
      width: 100%;
      background: var(--white);
      border: 1px solid var(--hair);
      border-radius: 24px;
      padding: 40px 32px;
      text-align: center;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 22px;
      color: var(--green);
      text-decoration: none;
      letter-spacing: -0.5px;
      margin-bottom: 24px;
    }
    .logo img { height: 28px; }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    p {
      color: var(--ink-soft);
      font-size: 15px;
      margin-bottom: 24px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 24px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
      cursor: pointer;
      border: none;
      margin-bottom: 12px;
    }
    .btn-primary {
      background: var(--green);
      color: var(--white);
    }
    .btn-primary:hover {
      background: var(--green-dark);
    }
    .btn-secondary {
      background: var(--mint);
      color: var(--green);
    }
    .btn-secondary:hover {
      background: var(--green-hair);
    }

    .hint {
      font-size: 13px;
      color: var(--ink-faint);
      margin-top: 16px;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid var(--green-hair);
      border-top-color: var(--green);
      border-radius: 50%;
      margin: 0 auto 20px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card" id="card">
    <!-- Filled in by script below -->
  </div>

  <script>
    (function () {
      var card = document.getElementById('card');

      // #878 NOTE: the /share/:type/:code branch below is currently
      // unreachable. korvi-app's #766/#874 Cloudflare Worker
      // (korvi-app/docs/deploy/share-preview-worker.js) transparently
      // proxies every request to korvi.eu/share/* — crawler or human —
      // straight to a Supabase edge function, which now handles the full
      // human-facing experience this file was originally built for
      // (styled tease + korvi:// redirect attempt), plus content-aware
      // OG tags for link-preview crawlers. GitHub Pages (and this file)
      // never sees a /share/* request while that Worker route exists.
      // Left in place rather than deleted in case routing ever moves back
      // to this repo — see korvi-app#878 and the not-yet-filed korvi-web
      // revamp ticket for the current thinking on where this should live
      // long-term.

      // Match /share/:type/:code (type = household|recipe, code = 7-char alphanumeric)
      var match = window.location.pathname.match(/^\/share\/([a-zA-Z]+)\/([a-zA-Z0-9]{1,16})\/?$/);

      if (!match) {
        // Not a share link — plain 404
        card.innerHTML =
          '<a href="/" class="logo"><img src="/logo-192.png" alt="Korvi">korvi</a>' +
          '<h1>Page not found</h1>' +
          '<p>That page doesn\'t exist. Head back to the homepage.</p>' +
          '<a href="/" class="btn btn-primary">Go to korvi.eu</a>';
        return;
      }

      var type = match[1];
      var code = match[2];
      var appUrl = 'korvi://share/' + type + '/' + code;
      var label = type === 'household' ? 'household invite' : 'shared recipe';

      card.innerHTML =
        '<div class="spinner"></div>' +
        '<a href="/" class="logo"><img src="/logo-192.png" alt="Korvi">korvi</a>' +
        '<h1>Opening this ' + label + '&hellip;</h1>' +
        '<p>This link opens in the Korvi app. If nothing happens, you may not have it installed yet.</p>' +
        '<a id="open-app" href="' + appUrl + '" class="btn btn-primary">Open in Korvi</a>' +
        '<a href="mailto:earlyaccess@korvi.eu?subject=Korvi%3A%20Early%20Access%20Request" class="btn btn-secondary">Get early access</a>' +
        '<div class="hint">Korvi is currently in early access on iOS and Android.</div>';

      // Attempt an app-scheme redirect; if the app isn't installed the tab just
      // stays put and the visitor sees the fallback card above.
      var attempted = false;
      function tryOpenApp() {
        if (attempted) return;
        attempted = true;
        window.location.href = appUrl;
      }
      // Small delay so the fallback UI paints first (avoids a blank flash on iOS
      // when the OS is deciding whether to hand off to the app).
      setTimeout(tryOpenApp, 250);
    })();
  </script>
</body>
</html>
